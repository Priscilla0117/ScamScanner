name: scam_scanner
description: "ScamScanner - AI-powered scam detection app for elderly Malaysians."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Google Generative AI (Gemini) ──
  google_generative_ai: ^0.4.7

  # ── Firebase ──
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1

  # ── Input / Media ──
  image_picker: ^1.2.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # ── On-device OCR ──
  google_mlkit_text_recognition: ^0.13.1

  # ── HTTP for REST calls ──
  http: ^1.2.2

  # ── Utilities ──
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
