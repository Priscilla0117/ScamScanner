    ================================================================
    IMPORTANT: Firebase Web Configuration

    After running `flutterfire configure`, the generated

    If Phone Auth reCAPTCHA still fails, add your Firebase web config
    inside the script tag below:

    <script>
      // Replace with your Firebase web config from Firebase Console
      // Project Settings → Your apps → Web app → Config
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };
    </script>
